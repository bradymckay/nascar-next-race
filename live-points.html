<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cup Series Live / Last Points</title>
</head>
<body>
  <h1>Next Cup Series Live / Last Points</h1>
  <div id="live-points">Loading...</div>

  <script>
    const proxy = "https://corsproxy.io/?"; // May fail with 403
    const raceListUrl = proxy + encodeURIComponent("https://cf.nascar.com/cacher/2025/race_list_basic.json");

    async function fetchLivePoints(seriesId, raceId) {
      const livePointsUrl = proxy + encodeURIComponent(`https://cf.nascar.com/live/feeds/${seriesId}/${raceId}/live_points.json`);
      try {
        const res = await fetch(livePointsUrl);
        if (!res.ok) throw new Error("Failed to fetch live points");
        const data = await res.json();
        if (!data || !data.points || !data.points.length) throw new Error("No points data");
        return data.points;
      } catch (err) {
        console.warn(`Live points fetch failed for race ${raceId}:`, err);
        return null;
      }
    }

    async function loadCupPoints() {
      const container = document.getElementById("live-points");
      try {
        const res = await fetch(raceListUrl);
        if (!res.ok) throw new Error("Failed to fetch race list");
        const raceList = await res.json();
        const cupRaces = raceList.series_1 || [];
        const now = new Date();

        const upcomingRaces = cupRaces
          .map(r => ({ ...r, dateObj: new Date(r.race_date) }))
          .filter(r => r.dateObj > now)
          .sort((a,b) => a.dateObj - b.dateObj);

        let raceToUse;
        if (upcomingRaces.length > 0) {
          raceToUse = upcomingRaces[0];
        } else {
          // If no upcoming races, fallback to last race
          const pastRaces = cupRaces
            .map(r => ({ ...r, dateObj: new Date(r.race_date) }))
            .filter(r => r.dateObj <= now)
            .sort((a,b) => b.dateObj - a.dateObj); // latest first
          raceToUse = pastRaces[0];
        }

        if (!raceToUse) {
          container.innerHTML = "No Cup Series races found.";
          return;
        }

        // Attempt live points for next race first
        let points = await fetchLivePoints(raceToUse.series_id, raceToUse.race_id);

        // If fetch fails, fallback to previous race
        if (!points) {
          const pastRaces = cupRaces
            .map(r => ({ ...r, dateObj: new Date(r.race_date) }))
            .filter(r => r.dateObj < raceToUse.dateObj)
            .sort((a,b) => b.dateObj - a.dateObj); // latest first
          if (pastRaces.length > 0) {
            const prevRace = pastRaces[0];
            points = await fetchLivePoints(prevRace.series_id, prevRace.race_id);
            raceToUse = prevRace;
          }
        }

        if (!points) {
          container.innerHTML = "Unable to fetch live or previous points.";
          return;
        }

        let html = `<h2>${raceToUse.race_name} (${raceToUse.track_name})</h2>`;
        html += `<table border="1" cellpadding="5">
          <tr><th>Pos</th><th>Driver</th><th>Points</th></tr>`;
        points.forEach(p => {
          html += `<tr>
            <td>${p.position}</td>
            <td>${p.driver_name}</td>
            <td>${p.total_points}</td>
          </tr>`;
        });
        html += "</table>";
        container.innerHTML = html;

      } catch (err) {
        container.innerHTML = "Error loading Cup Series points (check console).";
        console.error(err);
      }
    }

    loadCupPoints();
  </script>
</body>
</html>

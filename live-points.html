<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cup Series Live Points</title>
  <style>
    body { font-family: Arial; background: #0b0b0b; color: #fff; display:flex; justify-content:center; align-items:flex-start; flex-direction:column; padding:20px; }
    h1 { color: #f9d342; }
    table { border-collapse: collapse; width: 100%; max-width: 700px; margin-top: 10px; }
    th, td { border: 1px solid #444; padding: 6px 8px; text-align: left; }
    th { background-color: #222; }
  </style>
</head>
<body>
  <h1>🏁 Cup Series Live Points</h1>
  <div id="live-points">Loading live points...</div>

  <script>
    const seriesId = "series_1";
    const raceId = 5584; // next Cup Series race
    const livePointsUrl = `https://cf.nascar.com/live/feeds/${seriesId}/${raceId}/live_points.json`;

    async function loadLivePoints() {
      const container = document.getElementById("live-points");
      try {
        const res = await fetch(livePointsUrl);
        if (!res.ok) throw new Error(`Failed to fetch live points: ${res.status}`);
        const data = await res.json();

        if (!data || !data.points || !data.points.length) {
          container.innerHTML = "No points data available yet.";
          return;
        }

        let html = `<table>
          <tr><th>Pos</th><th>Driver</th><th>Points</th></tr>`;
        data.points.forEach(p => {
          html += `<tr>
            <td>${p.position}</td>
            <td>${p.driver_name}</td>
            <td>${p.total_points}</td>
          </tr>`;
        });
        html += "</table>";
        container.innerHTML = html;

      } catch (err) {
        container.innerHTML = "Error loading live points (check console).";
        console.error(err);
      }
    }

    loadLivePoints();

    // Optional: auto-refresh every 60 seconds
    setInterval(loadLivePoints, 60000);
  </script>
</body>
</html>

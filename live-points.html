<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cup Series Live Points</title>
</head>
<body>
  <h1>Next Cup Series Live Points</h1>
  <div id="live-points">Loading...</div>

  <script>
    const proxy = "https://corsproxy.io/?"; // Note: may fail with 403
    const raceListUrl = proxy + encodeURIComponent("https://cf.nascar.com/cacher/2025/race_list_basic.json");

    async function loadCupLivePoints() {
      const container = document.getElementById("live-points");
      try {
        // 1️⃣ Get the next Cup Series race
        const res = await fetch(raceListUrl);
        if (!res.ok) throw new Error("Failed to fetch race list");
        const raceList = await res.json();
        const cupRaces = raceList.series_1 || [];
        const now = new Date();
        const nextRace = cupRaces
          .map(r => ({ ...r, dateObj: new Date(r.race_date) }))
          .filter(r => r.dateObj > now)
          .sort((a,b) => a.dateObj - b.dateObj)[0];

        if (!nextRace) {
          container.innerHTML = "No upcoming Cup Series race found.";
          return;
        }

        const seriesId = nextRace.series_id;
        const raceId = nextRace.race_id;

        // 2️⃣ Attempt to fetch live points
        const livePointsUrl = proxy + encodeURIComponent(`https://cf.nascar.com/live/feeds/${seriesId}/${raceId}/live_points.json`);
        const liveRes = await fetch(livePointsUrl);
        if (!liveRes.ok) throw new Error("Failed to fetch live points");
        const liveData = await liveRes.json();

        if (!liveData || !liveData.points || !liveData.points.length) {
          container.innerHTML = "No live points available yet.";
          return;
        }

        // 3️⃣ Display points
        let html = `<table border="1" cellpadding="5">
          <tr><th>Pos</th><th>Driver</th><th>Points</th></tr>`;
        liveData.points.forEach(p => {
          html += `<tr>
            <td>${p.position}</td>
            <td>${p.driver_name}</td>
            <td>${p.total_points}</td>
          </tr>`;
        });
        html += "</table>";
        container.innerHTML = html;

      } catch (err) {
        container.innerHTML = "Error fetching live points (likely CORS/403). Check console.";
        console.error(err);
      }
    }

    loadCupLivePoints();
  </script>
</body>
</html>

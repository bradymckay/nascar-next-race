<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cup Series Live Points</title>
</head>
<body>
  <h1>Next Cup Series Live Points</h1>
  <div id="live-points">Loading...</div>

  <script>
    const livePointsUrl = "https://cf.nascar.com/live/feeds/series_1/5584/live_points.json";

    async function loadLivePoints() {
      const container = document.getElementById("live-points");
      try {
        const res = await fetch(livePointsUrl);
        if (!res.ok) throw new Error(`Failed to fetch live points: ${res.status}`);
        const data = await res.json();

        if (!data || !data.points || !data.points.length) {
          container.innerHTML = "No points data available yet.";
          return;
        }

        let html = `<table border="1" cellpadding="5">
          <tr><th>Pos</th><th>Driver</th><th>Points</th></tr>`;
        data.points.forEach(p => {
          html += `<tr>
            <td>${p.position}</td>
            <td>${p.driver_name}</td>
            <td>${p.total_points}</td>
          </tr>`;
        });
        html += "</table>";
        container.innerHTML = html;

      } catch (err) {
        container.innerHTML = "Error loading live points (check console).";
        console.error(err);
      }
    }

    loadLivePoints();
    setInterval(loadLivePoints, 60000); // refresh every 60s
  </script>
</body>
</html>
